        <div class="spinner-border text-primary" role="status"></div>
    </div>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="./index.html">ราชกิจจานุเบกษา</a>

            </button>

            <div class="collapse navbar-collapse" id="navbarMain">

    <!-- Content -->
    <main class="container py-4">
        <h3 class="mb-4">ราชกิจจานุเบกษาที่ประกาศล่าสุด</h3>
        <!-- ดึงข้อมูลจาก gg script แบบ json 2 แรก -->
        <div class="new-two-ratchakitcha" id="new-ratchakitcha"></div>

        <h1 class="mb-4">ราชกิจจานุเบกษาที่ประกาศล่าสุด ๑๐๐ รายการ</h1>
        
        <!-- ทำช่องค้นหาราชกิจจานุเบกษา เลือกประเภทได้ select แล้วปค้นหาก็ได้ -->
        <div class="search-box mb-4">
            <div class="row g-2">
                <div class="col-md-6">
                    <input type="text" id="searchInput" class="form-control" placeholder="ค้นหาราชกิจจานุเบกษา...">
                </div>
                <div class="col-md-3">
                    <select id="typeFilter" class="form-select">
                        <option value="">ทุกประเภท</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn w-100" onclick="searchData()">ค้นหา</button>
                </div>
            </div>
        </div>
        
        <!-- ดึงข้อมูลจาก gg script แบบ json 100 แรก + ล่างสุดมีปุ่มดูเพิ่ม เจนทีละ 10 ตอนแรก 10 +10 +10 ... จนหมด ถ้าผู้ใช้กดถึงนะ -->
        <div class="all-ratchakitcha" id="all-ratchakitcha"></div>
    </main>
