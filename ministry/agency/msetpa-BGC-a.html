<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบค้นหากิจการ - กรมพัฒนาธุรกิจการค้า</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/assets/TheGarudaEmblem.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
  body {
    font-family: "Sarabun", sans-serif;
    margin: 0;
    background: #f4f6f9;
  }

  header {
    background: #0b3d91;
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header img {
    height: 40px;
  }

  .container {
    max-width: 1100px;
    margin: 20px auto;
    padding: 15px;
  }

  .search-box {
    margin-bottom: 20px;
  }

  .search-box input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ccc;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 15px;
  }

  .card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }

  .card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
  }

  .title {
    font-weight: bold;
    font-size: 18px;
    margin-top: 10px;
  }

  .meta {
    font-size: 14px;
    color: #555;
    margin-top: 5px;
  }

  .badge {
    display: inline-block;
    background: #0b3d91;
    color: white;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>

<body>

<header>
  <img src="https://thaigov.info-nis2026.workers.dev/assets/TheGarudaEmblem.png">
  <div>
    <div><b>กรมพัฒนาธุรกิจการค้า</b></div>
    <div style="font-size:13px;">Thailand Government</div>
  </div>
  <img src="https://thaigov.info-nis2026.workers.dev/assets/thai.png" style="margin-left:auto;">
</header>

<div class="container">

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อกิจการ / บริษัท / ประเภทกิจการ...">
  </div>

  <div class="grid" id="result"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwobQw8vdFH2LB7inCjiUVUvNLUH4BbTRqie_rz0xcq3DMUKshCq3A2eAG1CvCMxYwLxg/exec";

let allData = [];

async function loadData() {
  const res = await fetch(API_URL);
  const json = await res.json();
  allData = json.data;
  render(allData);
}

function render(data) {
  const container = document.getElementById("result");
  container.innerHTML = "";

  if (data.length === 0) {
    container.innerHTML = "<p>ไม่พบข้อมูล</p>";
    return;
  }

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${item["ภาพ"]}" onerror="this.src=''">
      <div class="title">${item["ชื่อกิจการ"]}</div>
      <div class="meta"><b>บริษัท:</b> ${item["ชื่อบริษัท"]}</div>
      <div class="meta"><b>ประเภท:</b> ${item["ลักษณะกิจการ"]}</div>
      <div class="meta"><b>ผู้จดทะเบียน:</b> ${item["ผู้จดทะเบียน"]}</div>
      <div class="meta"><b>วันที่:</b> ${formatDate(item["วันจดทะเบียน"])}</div>
      <div class="badge">จดทะเบียนแล้ว</div>
    `;

    container.appendChild(div);
  });
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleString("th-TH");
}

document.getElementById("searchInput").addEventListener("input", function() {
  const keyword = this.value.toLowerCase();

  const filtered = allData.filter(item =>
    (item["ชื่อกิจการ"] || "").toLowerCase().includes(keyword) ||
    (item["ชื่อบริษัท"] || "").toLowerCase().includes(keyword) ||
    (item["ลักษณะกิจการ"] || "").toLowerCase().includes(keyword)
  );

  render(filtered);
});

loadData();
</script>

</body>
</html>
