<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/assets/TheGarudaEmblem.png" type="image/x-icon">
    <title>ระบบตรวจสอบสถานะทะเบียนกิจการสื่อ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Reset & Base */

        ::selection {
            background: #2d2a4a;
            color: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            /* align-items: center; */
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            max-width: 820px;
            width: 100%;
            /* background-color: #ffffff; */
            background-color: transparent;
            border-radius: 5px;
            /* box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 16px rgba(0, 0, 0, 0.06); */
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        /* Header section */
        .header {
            background: linear-gradient(145deg, #0d623f 0%, #0a4f32 100%);
            padding: 28px 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid #f9c74f;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-left img {
            height: 52px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .header-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        .header-title span {
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.85;
            letter-spacing: 0.3px;
        }

        .header-badge {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 60px;
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.25);
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .header-badge img {
            width: 20px;
            height: 15px;
            margin-right: 5px;
        }

        /* Search area */
        .search-wrapper {
            padding: 28px 32px 20px 32px;
            /* background-color: #ffffff; */
        }

        .search-label {
            display: block;
            font-weight: 600;
            color: #1e2a3a;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .search-box input {
            flex: 1 1 240px;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 1rem;
            background-color: #f9fafc;
            transition: all 0.25s ease;
            outline: none;
            color: #1e2a3a;
        }

        .search-box input:focus {
            border-color: #0d623f;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(13, 98, 63, 0.12);
        }

        .search-box input::placeholder {
            color: #94a3b8;
            font-weight: 300;
        }

        .search-btn {
            background: #0d623f;
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(13, 98, 63, 0.25);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #0a4f32;
            transform: scale(1.02);
            box-shadow: 0 8px 16px rgba(13, 98, 63, 0.3);
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        /* Result area */
        .result-container {
            padding: 4px 32px 32px 32px;
            /* background-color: #ffffff; */
        }

        .result-stats {
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .result-stats span {
            background: #f1f5f9;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 500;
            color: #0d623f;
        }

        #result {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .result-item {
            background: #f9fafc;
            /* border-radius: 20px; */
            padding: 20px 24px;
            border-left: 6px solid #0d623f;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .result-item:hover {
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(13, 98, 63, 0.08);
            transform: translateY(-2px);
        }

        .result-item .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0d623f;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .result-item .title .badge {
            font-size: 0.7rem;
            font-weight: 600;
            background: #e6f7ed;
            color: #0d623f;
            padding: 4px 14px;
            border-radius: 30px;
            letter-spacing: 0.3px;
        }

        .result-item .detail {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 28px;
            margin-top: 6px;
            color: #1e293b;
        }

        .result-item .detail .field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .result-item .detail .field .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #64748b;
            font-weight: 600;
        }

        .result-item .detail .field .value {
            margin-top: 10px;
            font-weight: 500;
            font-size: 1rem;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            background: #eef2ff;
            color: #1e293b;
        }

        .status-badge.active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #64748b;
            background: #f8fafc;
            border-radius: 28px;
            border: 1px dashed #d1d9e6;
        }

        .empty-state strong {
            color: #1e293b;
            display: block;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .empty-state span {
            font-size: 0.95rem;
        }

        /* footer */
        .footer {
            background: #f1f5f9;
            padding: 16px 32px;
            text-align: center;
            font-size: 0.75rem;
            color: #475569;
            border-top: 1px solid #e2e8f0;
        }

        .footer a {
            color: #0d623f;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* responsive */
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 20px;
            }
            .header-badge {
                align-self: flex-start;
            }
            .search-wrapper {
                padding: 20px;
            }
            .result-container {
                padding: 0 20px 24px 20px;
            }
            .search-box input {
                flex: 1 1 100%;
            }
            .search-btn {
                width: 100%;
                justify-content: center;
            }
            .result-item .title {
                font-size: 1.1rem;
            }
            .header-title {
                font-size: 1.1rem;
            }
        }

        /* loading shimmer (optional) */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Skeleton Loader */
        .skeleton-item {
            pointer-events: none;
            animation: skeleton-pulse 1.2s ease-in-out infinite;
        }

        .skeleton {
            display: inline-block;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s ease-in-out infinite;
            border-radius: 6px;
            color: transparent !important;
            user-select: none;
        }

        .skeleton-line {
            display: block;
            height: 14px;
            margin-bottom: 6px;
            border-radius: 6px;
        }

        .skeleton-line-xs { width: 40%; height: 12px; }
        .skeleton-line-sm { width: 60%; height: 14px; }
        .skeleton-line-md { width: 80%; height: 16px; }
        .skeleton-line-lg { width: 90%; height: 20px; }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes skeleton-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ปรับปรุงผลลัพธ์ให้ดูดี */
        .result-item .title .badge.skeleton {
            min-width: 40px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <img src="/assets/TheGarudaEmblem.png" alt="ตราสัญลักษณ์">
            <div class="header-title">
                ตรวจสอบสถานะทะเบียนสื่อ
                <span>กรมกิจการสื่อและโทรคมนาคม</span>
            </div>
        </div>
        <div class="header-badge">
            <img src="/assets/thai.png" alt="TH"> Thailand Government
        </div>
    </div>

    <!-- Search -->
    <div class="search-wrapper">
        <label class="search-label" for="q"> ค้นหาจากชื่อผู้จดทะเบียน หรือชื่อกิจการสื่อ</label>
        <div class="search-box">
            <input id="q" type="text" placeholder="เช่น บริษัท ไทยสมาร์ท จำกัด หรือ ชื่อบุคคล" />
            <button class="search-btn" onclick="search()">ค้นหา</button>
        </div>
    </div>

    <!-- Result -->
    <div class="result-container">
        <div class="result-stats" id="resultStats">
            <span id="countDisplay">รอค้นหา</span>
        </div>
        <div id="result"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
        ข้อมูลจากระบบจดทะเบียนธุรกิจ &nbsp;·&nbsp; <a href="#" onclick="event.preventDefault();">ปรับปรุงล่าสุด</a>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbydQ5VPTffoKJGmYeg1tndy6RC4zcyMJSQhFxifs1JUKvBisZDEquw8pKswgrRFw2RH/exec";

    // สร้างฟังก์ชันสำหรับจัดสถานะให้มีสี
    function getStatusBadge(statusText) {
        if (!statusText) return `<span class="status-badge">—</span>`;
        const text = statusText.trim();
        let cls = "status-badge";
        if (text.includes("รับจด") || text.includes("จดทะเบียน") || text.includes("ดำเนินการ")) {
            cls += " active";
        } else if (text.includes("ยกเลิก") || text.includes("ไม่ผ่าน") || text.includes("ปฏิเสธ")) {
            cls += " inactive";
        } else if (text.includes("รอ") || text.includes("ตรวจสอบ")) {
            cls += " pending";
        } else {
            cls += " active"; // fallback
        }
        return `<span class="${cls}">${text}</span>`;
    }

    // ===== SKELETON LOADER =====
    function showSkeletonLoader(count = 3) {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const skeleton = document.createElement('div');
            skeleton.className = 'result-item skeleton-item';
            skeleton.innerHTML = `
                <div class="title skeleton">
                    <span class="skeleton-line skeleton-line-lg"></span>
                    <span class="badge skeleton skeleton-line skeleton-line-sm"></span>
                </div>
                <div class="detail">
                    <div class="field">
                        <span class="label skeleton skeleton-line skeleton-line-xs"></span>
                        <span class="value skeleton skeleton-line skeleton-line-md"></span>
                    </div>
                    <div class="field">
                        <span class="label skeleton skeleton-line skeleton-line-xs"></span>
                        <span class="value skeleton skeleton-line skeleton-line-sm"></span>
                    </div>
                </div>
            `;
            resultDiv.appendChild(skeleton);
        }
        document.getElementById("countDisplay").innerHTML = '<i class="fa-solid fa-hourglass-half"></i> กำลังโหลด...';
    }

    function search() {
        const q = document.getElementById("q").value.trim();
        const resultDiv = document.getElementById("result");
        const countSpan = document.getElementById("countDisplay");

        if (!q) {
            resultDiv.innerHTML = `<div class="empty-state"><strong>🔎 โปรดป้อนชื่อที่ต้องการค้นหา</strong><span>เช่น ชื่อผู้จดทะเบียน หรือชื่อบริษัท</span></div>`;
            countSpan.textContent = "0 รายการ";
            return;
        }

        // ✅ แสดง Skeleton Loader แทนข้อความ "กำลังค้นหา..."
        showSkeletonLoader(4);

        fetch(API_URL + "?q=" + encodeURIComponent(q))
            .then(res => {
                if (!res.ok) throw new Error("Network response was not ok");
                return res.json();
            })
            .then(res => {
                resultDiv.innerHTML = "";
                const items = res.data || [];

                if (!items.length) {
                    resultDiv.innerHTML = `<div class="empty-state"><strong>😕 ไม่พบข้อมูล</strong><span>ลองเปลี่ยนคำค้น หรือตรวจสอบตัวสะกด</span></div>`;
                    countSpan.textContent = "0 รายการ";
                    return;
                }

                countSpan.textContent = `พบ ${items.length} รายการ`;

                items.forEach((item, index) => {
                    const name = item["ชื่อผู้จดทะเบียน"] || "—";
                    const company = item["ชื่อกิจการสื่อ (ภาษาไทย)"] || "—";
                    const statusRaw = item["ผลการจดทะเบียนทะเลเบียนกิจการ"] || item["ผลการจดทะเบียนทะเบียนกิจการ"] || "ไม่ระบุ";
                    const statusHtml = getStatusBadge(statusRaw);

                    const itemDiv = document.createElement("div");
                    itemDiv.className = "result-item";
                    itemDiv.style.animationDelay = (index * 0.05) + "s";

                    itemDiv.innerHTML = `
                        <div class="title">
                            <span><i class="fa-solid fa-thumbtack"></i> ${name}</span>
                            <span class="badge">#${index+1}</span>
                        </div>
                        <div class="detail">
                            <div class="field">
                                <span class="label"><i class="fa-solid fa-building"></i> ชื่อบริษัท (ไทย)</span>
                                <span class="value">${company}</span>
                            </div>
                            <div class="field">
                                <span class="label"><i class="fa-solid fa-clipboard-list"></i> สถานะ</span>
                                <span class="value">${statusHtml}</span>
                            </div>
                        </div>
                    `;
                    resultDiv.appendChild(itemDiv);
                });
            })
            .catch(err => {
                console.error("Error:", err);
                resultDiv.innerHTML = `<div class="empty-state"><strong>⚠️ เกิดข้อผิดพลาด</strong><span>ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้ กรุณาลองอีกครั้ง</span></div>`;
                countSpan.textContent = "❌";
            });
    }

    // กด Enter ใน input แล้วค้นหา
    document.getElementById("q").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            search();
        }
    });

    window.addEventListener("DOMContentLoaded", function() {
        document.getElementById("result").innerHTML = `
            <div class="empty-state">
                <strong><i class="fa fa-search" aria-hidden="true"></i> เริ่มค้นหาข้อมูล</strong>
                <span>พิมพ์ชื่อผู้จดทะเบียนหรือชื่อบริษัท แล้วกดปุ่มค้นหา</span>
            </div>
        `;
        document.getElementById("countDisplay").textContent = "พร้อมใช้งาน";
    });
</script>

</body>
</html>
